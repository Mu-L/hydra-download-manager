[Launch]
ProgramExecutable=Hydra\hydra-gui.exe
; Hydra has its own portable profile: --config puts config.toml, state.redb,
; logs and locales wherever it is pointed, and gives that instance its own
; single-instance lock. Letting the app do it beats the launcher's
; DirectoriesMove, which would displace the real %APPDATA%\hydra of an
; installed Hydra for as long as this copy runs - and leave it displaced if
; the launcher is killed.
CommandLineArguments=--config "%PAL:DataDir%\hydra"
RunAsAdmin=none
SinglePortableAppInstance=true
; Not SingleAppInstance: --config is exactly what lets this copy run beside an
; ordinary install, so a running hydra-gui.exe must not block the launch.
SingleAppInstance=false
WaitForExe1=hydra-gui.exe
WorkingDirectory=%PAL:AppDir%\Hydra
DirectoryMoveOK=yes

[Activate]
Registry=true

[Environment]
; Hydra remuxes HLS through ffmpeg when it can find one; dropping a build
; under App\Hydra\ffmpeg\bin is how a portable copy carries its own.
PATH=%PATH%;%PAL:AppDir%\Hydra\ffmpeg\bin
