name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: check
        name: Compare version with Git tag
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          echo "manifest=$VERSION tag=$TAG"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: amd64
            runner: macos-latest
            target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
      PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies (ALSA, X11)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libx11-dev libxrandr-dev \
            libxcb1-dev libxkbcommon-dev rpm imagemagick

      - name: Install NSIS (Windows installer)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            choco install nsis -y --no-progress
            echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI, GUI, and native-messaging host
        run: cargo build --release --locked --target ${{ matrix.target }} -p hya-cli -p hya-gui -p hya-host

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release"
          EXT=""
          [ "${{ matrix.os }}" = windows ] && EXT=".exe"

          CLI_NAME="hydra-cli-${VERSION}-${PLATFORM}"
          GUI_NAME="hydra-${VERSION}-${PLATFORM}"
          mkdir -p dist "stage/${CLI_NAME}" "stage/${GUI_NAME}/extensions"

          # CLI archive: the standalone `hydra` binary only.
          cp "${BIN}/hydra${EXT}" "stage/${CLI_NAME}/"
          cp LICENSE LICENSING.md THIRD-PARTY-NOTICES.md README.md "stage/${CLI_NAME}/"

          # Man pages travel with both archives on Unix; install.sh puts them
          # under <prefix>/share/man/man1.
          if [ "${{ matrix.os }}" != windows ]; then
            mkdir -p "stage/${CLI_NAME}/man" "stage/${GUI_NAME}/man"
            cp docs/man/*.1 "stage/${CLI_NAME}/man/"
            cp docs/man/*.1 "stage/${GUI_NAME}/man/"
          fi

          # GUI archive: GUI + CLI + native-messaging host + browser extensions.
          # The install-native-host script resolves the bundle root as the
          # parent of its own directory, so it must sit in scripts/ with
          # extensions/ as a sibling.
          mkdir -p "stage/${GUI_NAME}/scripts"
          cp "${BIN}/hydra-gui${EXT}" "${BIN}/hydra${EXT}" "${BIN}/hydra-host${EXT}" "stage/${GUI_NAME}/"
          cp -R extensions/chrome extensions/firefox extensions/safari "stage/${GUI_NAME}/extensions/"
          if [ "${{ matrix.os }}" = windows ]; then
            cp scripts/install-native-host.ps1 "stage/${GUI_NAME}/scripts/"
          else
            cp scripts/install-native-host.sh "stage/${GUI_NAME}/scripts/"
          fi
          cp LICENSE LICENSING.md THIRD-PARTY-NOTICES.md README.md "stage/${GUI_NAME}/"

          if [ "${{ matrix.os }}" = windows ]; then
            (cd stage && 7z a "../dist/${CLI_NAME}.zip" "${CLI_NAME}")
            (cd stage && 7z a "../dist/${GUI_NAME}.zip" "${GUI_NAME}")
          else
            tar -czf "dist/${CLI_NAME}.tar.gz" -C stage "${CLI_NAME}"
            tar -czf "dist/${GUI_NAME}.tar.gz" -C stage "${GUI_NAME}"
          fi
          ls -lh dist/

      # Native installers. The packaging scripts read CARGO_BUILD_TARGET to
      # find the binaries under target/<triple>/release (and, for macOS, to
      # name the image after the target arch rather than the build host).
      - name: Build DMG (macOS)
        if: matrix.os == 'macos'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/package-macos-dmg.sh
          cp target/dist/*.dmg dist/
          ls -lh dist/

      - name: Build PKG (macOS)
        if: matrix.os == 'macos'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/package-macos-pkg.sh
          cp target/dist/*.pkg dist/
          ls -lh dist/

      - name: Build deb and rpm packages (Linux)
        if: matrix.os == 'linux'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/package-linux.sh all --no-build
          cp target/dist/*.deb target/dist/*.rpm dist/
          ls -lh dist/

      - name: Build NSIS installer (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          ARCH=x64
          [ "${{ matrix.arch }}" = arm64 ] && ARCH=arm64
          scripts/build-windows-installer.sh "$ARCH" --no-build
          cp "target/hydra-${VERSION}-windows-${ARCH}-setup.exe" dist/
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hydra-${{ env.PLATFORM }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-version, build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: hydra ${{ needs.verify-version.outputs.version }}
          files: dist/*
          generate_release_notes: true

  publish-crates:
    name: Publish crates.io release
    runs-on: ubuntu-latest
    needs: [verify-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_PUBLISH_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "Publishing workspace version ${VERSION}"

          USER_AGENT="hydra-release-ci (${VERSION}; +https://github.com/ja7ad/hydra)"

          sparse_index_url() {
            local name
            name=$(echo "$1" | tr '[:upper:]' '[:lower:]')
            local len=${#name}
            if [ "$len" -eq 1 ]; then
              echo "https://index.crates.io/1/${name}"
            elif [ "$len" -eq 2 ]; then
              echo "https://index.crates.io/2/${name}"
            elif [ "$len" -eq 3 ]; then
              echo "https://index.crates.io/3/${name:0:1}/${name}"
            else
              echo "https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
            fi
          }

          is_indexed() {
            local name="$1"
            curl -sf -A "$USER_AGENT" "$(sparse_index_url "$name")" \
              | grep -q "\"vers\":\"${VERSION}\""
          }

          publish_crate() {
            local name="$1"
            if is_indexed "$name"; then
              echo "${name} ${VERSION} is already published, skipping"
              return
            fi
            echo "Publishing ${name} ${VERSION}"
            cargo publish -p "${name}" --locked
            echo "Waiting for ${name} ${VERSION} to be indexed on crates.io..."
            for _ in $(seq 1 60); do
              if is_indexed "$name"; then
                echo "${name} ${VERSION} is live"
                return
              fi
              sleep 10
            done
            echo "Timed out waiting for ${name} ${VERSION} to be indexed" >&2
            exit 1
          }

          # Publish in topological dependency order. Only the library crates go
          # to crates.io; hya-cli / hya-gui / hya-host are `publish = false`
          # and ship as release binaries instead:
          # 1. hya-core (pure algorithmic foundation, no intra-workspace deps)
          # 2. hya-net (depends on hya-core)
          publish_crate hya-core
          publish_crate hya-net
