name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag_version: ${{ steps.check.outputs.tag_version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: check
        name: Compare version with Git tag
        run: |
          set -euo pipefail
          # The release tag tracks the workspace product version
          # ([workspace.package] in Cargo.toml), which hya-gui, hya-cli and
          # hya-host inherit and ship under as one bundle. The library crates
          # (hya-core, hya-net) version independently of it and are published
          # by .github/workflows/publish-crates.yml on their own manifest bump,
          # not by a release tag.
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          # A tag may carry a semver pre-release suffix (v0.3.0-rc,
          # v0.3.0-rc.2, v0.3.0-beta1) that the manifest does not. Both spellings
          # are accepted: the manifest may stay on the plain release version
          # while release candidates are cut from tags, or it may carry the same
          # suffix so the shipped binaries report it. Everything after the first
          # `-` marks the tag as a pre-release.
          BASE="${TAG%%-*}"
          if [ "$TAG" != "$BASE" ]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "manifest=$VERSION tag=$TAG base=$BASE prerelease=$PRERELEASE"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VERSION" != "$TAG" ] && [ "$VERSION" != "$BASE" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $VERSION"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag_version=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: amd64
            runner: macos-latest
            target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
      PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies (ALSA, X11)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libx11-dev libxrandr-dev \
            libxcb1-dev libxkbcommon-dev rpm imagemagick

      - name: Install NSIS (Windows installer)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            choco install nsis -y --no-progress
            echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI, GUI, native-messaging host, and update finisher
        run: cargo build --release --locked --target ${{ matrix.target }} -p hya-cli -p hya-gui -p hya-host -p hya-updater

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release"
          EXT=""
          [ "${{ matrix.os }}" = windows ] && EXT=".exe"

          CLI_NAME="hydra-cli-${VERSION}-${PLATFORM}"
          GUI_NAME="hydra-${VERSION}-${PLATFORM}"
          mkdir -p dist "stage/${CLI_NAME}" "stage/${GUI_NAME}/extensions"

          # CLI archive: the standalone `hydra` binary only.
          cp "${BIN}/hydra${EXT}" "stage/${CLI_NAME}/"
          cp LICENSE LICENSING.md THIRD-PARTY-NOTICES.md README.md "stage/${CLI_NAME}/"

          # Man pages travel with both archives on Unix; install.sh puts them
          # under <prefix>/share/man/man1.
          if [ "${{ matrix.os }}" != windows ]; then
            mkdir -p "stage/${CLI_NAME}/man" "stage/${GUI_NAME}/man"
            cp docs/man/*.1 "stage/${CLI_NAME}/man/"
            cp docs/man/*.1 "stage/${GUI_NAME}/man/"
          fi

          # GUI archive: GUI + CLI + native-messaging host + browser extensions.
          # The install-native-host script resolves the bundle root as the
          # parent of its own directory, so it must sit in scripts/ with
          # extensions/ as a sibling.
          mkdir -p "stage/${GUI_NAME}/scripts"
          # hydra-updater is the self-update finisher: the GUI extracts a new
          # release, runs this binary from a temp dir, exits, and the finisher
          # swaps the installed files and relaunches.
          cp "${BIN}/hydra-gui${EXT}" "${BIN}/hydra${EXT}" "${BIN}/hydra-host${EXT}" "${BIN}/hydra-updater${EXT}" "stage/${GUI_NAME}/"
          cp -R extensions/chrome extensions/firefox extensions/safari "stage/${GUI_NAME}/extensions/"
          if [ "${{ matrix.os }}" = windows ]; then
            cp scripts/install-native-host.ps1 "stage/${GUI_NAME}/scripts/"
          else
            cp scripts/install-native-host.sh "stage/${GUI_NAME}/scripts/"
          fi
          cp LICENSE LICENSING.md THIRD-PARTY-NOTICES.md README.md "stage/${GUI_NAME}/"

          if [ "${{ matrix.os }}" = windows ]; then
            (cd stage && 7z a "../dist/${CLI_NAME}.zip" "${CLI_NAME}")
            (cd stage && 7z a "../dist/${GUI_NAME}.zip" "${GUI_NAME}")
          else
            tar -czf "dist/${CLI_NAME}.tar.gz" -C stage "${CLI_NAME}"
            tar -czf "dist/${GUI_NAME}.tar.gz" -C stage "${GUI_NAME}"
          fi
          ls -lh dist/

      # Native installers. The packaging scripts read CARGO_BUILD_TARGET to
      # find the binaries under target/<triple>/release (and, for macOS, to
      # name the image after the target arch rather than the build host).
      - name: Build DMG (macOS)
        if: matrix.os == 'macos'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/package-macos-dmg.sh
          cp target/dist/*.dmg dist/
          ls -lh dist/

      - name: Build PKG (macOS)
        if: matrix.os == 'macos'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/package-macos-pkg.sh
          cp target/dist/*.pkg dist/
          ls -lh dist/

      - name: Build deb and rpm packages (Linux)
        if: matrix.os == 'linux'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/package-linux.sh all --no-build
          cp target/dist/*.deb target/dist/*.rpm dist/
          ls -lh dist/

      - name: Build NSIS installer (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          ARCH=x64
          [ "${{ matrix.arch }}" = arm64 ] && ARCH=arm64
          scripts/build-windows-installer.sh "$ARCH" --no-build
          cp "target/hydra-${VERSION}-windows-${ARCH}-setup.exe" dist/
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hydra-${{ env.PLATFORM }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-version, build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A pre-release tag (v0.3.0-rc) is published as a GitHub pre-release and
      # is never marked latest, so `releases/latest` — what the in-app updater
      # polls — keeps pointing at the last stable release. A plain tag
      # (v0.3.0) becomes the latest release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: hydra ${{ needs.verify-version.outputs.tag_version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify-version.outputs.prerelease != 'true' }}

      - name: Update Homebrew Tap
        if: needs.verify-version.outputs.prerelease != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ja7ad/homebrew-tap.git" tap
            scripts/update-homebrew.sh "${{ needs.verify-version.outputs.version }}" dist tap
            cd tap
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/hydra.rb Casks/hydra.rb
            if ! git diff --staged --quiet; then
              git commit -m "chore(hydra): bump to v${{ needs.verify-version.outputs.version }}"
              git push origin main
            fi
          else
            echo "note: HOMEBREW_TAP_TOKEN not set; skipping automated tap update"
          fi
