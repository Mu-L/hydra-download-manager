# Config for release-drafter/release-drafter, driven by the .github/workflows/release-drafter.yml
# workflow. Maintains a running draft GitHub Release, categorized from PR titles/branch names
# that follow the Conventional Commits convention documented in CONTRIBUTING.md.
name-template: 'hydra v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '⚠️ Breaking Changes'
    label: 'breaking-change'
  - title: '🚀 Features'
    label: 'feature'
  - title: '🐛 Bug Fixes'
    label: 'bug'
  - title: '⚡ Performance'
    label: 'performance'
  - title: '📝 Documentation'
    label: 'documentation'
  - title: '♻️ Refactoring'
    label: 'refactor'
  - title: '📦 Dependencies'
    label: 'dependencies'
  - title: '🔧 Maintenance'
    label: 'maintenance'

# PRs are labeled automatically from their title/branch, so contributors don't have to
# label anything by hand — mirrors the `<type>(<scope>): summary` convention from
# CONTRIBUTING.md and the feat/*, fix/* branch naming spirit.
autolabeler:
  - label: 'breaking-change'
    title:
      - '/^\w+(\(.+\))?!:/'
  - label: 'feature'
    branch:
      - '/^feat\//'
    title:
      - '/^feat(\(.+\))?:/'
  - label: 'bug'
    branch:
      - '/^fix\//'
    title:
      - '/^fix(\(.+\))?:/'
  - label: 'performance'
    branch:
      - '/^perf\//'
    title:
      - '/^perf(\(.+\))?:/'
  - label: 'documentation'
    branch:
      - '/^docs\//'
    title:
      - '/^docs(\(.+\))?:/'
  - label: 'refactor'
    branch:
      - '/^refactor\//'
    title:
      - '/^refactor(\(.+\))?:/'
  - label: 'dependencies'
    title:
      - '/^chore\(deps\):/'
  - label: 'maintenance'
    title:
      - '/^(chore|ci|test)(\(.+\))?:/'

# Version bump suggested for the *next* tag, based on the highest-impact label seen.
# hydra's actual release version is still authoritative from Cargo.toml + the pushed
# git tag (enforced by the verify-version job in release.yml) — this only drives the
# $RESOLVED_VERSION placeholder shown in the running draft.
version-resolver:
  major:
    labels:
      - 'breaking-change'
  minor:
    labels:
      - 'feature'
  patch:
    labels:
      - 'bug'
      - 'performance'
      - 'documentation'
      - 'refactor'
      - 'dependencies'
      - 'maintenance'
  default: patch

exclude-labels:
  - 'skip-changelog'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'
sort-by: 'merged_at'
sort-direction: 'ascending'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/ja7ad/hydra/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  Thanks to $CONTRIBUTORS for making this release possible! 🐉

no-changes-template: '_No notable changes yet._'
