<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <span class="title">Hydra</span>
      <span id="status" class="status" title="">●</span>
    </header>

    <label class="row toggle">
      <input type="checkbox" id="enabled" />
      <span>Capture downloads</span>
    </label>

    <label class="row toggle">
      <input type="checkbox" id="video-panel" />
      <span>Download button on videos</span>
    </label>

    <label class="row field" title="How long the button stays on a video after it appears. 0 keeps it until you dismiss it.">
      <span>Hide it after</span>
      <input type="number" id="panel-timeout" min="0" max="600" step="1" />
      <span>seconds (0 = never)</span>
    </label>

    <label
      class="row toggle"
      id="proxy-row"
      hidden
      title="Hand each captured download the proxy this browser is using, for that download only. Hydra's own Options are left alone."
    >
      <input type="checkbox" id="browser-proxy" />
      <span>Use this browser's proxy</span>
    </label>

    <div class="row field" id="proxy-note" hidden><span></span></div>

    <div class="actions">
      <button id="open-hydra">Open Hydra</button>
      <button id="all-links">Download all links</button>
    </div>

    <section id="stream-section" hidden>
      <h2>Streams on this page</h2>
      <ul id="stream-list"></ul>
    </section>

    <section id="media-section" hidden>
      <h2>Media on this page</h2>
      <ul id="media-list"></ul>
    </section>

    <footer id="hint"></footer>
    <script src="popup.js"></script>
  </body>
</html>
