# Codecov configuration for HYDRA

coverage:
  precision: 2
  round: down
  range: "70...95"

  status:
    project:
      default:
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 75%
        threshold: 5%

ignore:
  - "crates/*/examples/**"
  - "crates/*/benches/**"
  - "crates/hydra-gui/**"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
